
name: Update Lodge V Organization Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Update organization statistics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.LODGE_STATS_TOKEN }}
          script: |
            const org = "Lodge-V";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get all organization repositories
            const repos = await github.paginate(
              github.rest.repos.listForOrg,
              {
                org,
                type: "all",
                per_page: 100
              }
            );

            // Get organization members
            const members = await github.paginate(
              github.rest.orgs.listMembers,
              {
                org,
                filter: "all",
                per_page: 100
              }
            );

            // Calculate commits from the last 365 days
            const sinceDate = new Date();
            sinceDate.setUTCDate(sinceDate.getUTCDate() - 365);

            const since = sinceDate.toISOString();

            let totalCommits = 0;

            for (const repository of repos) {
              try {
                const commits = await github.paginate(
                  github.rest.repos.listCommits,
                  {
                    owner: org,
                    repo: repository.name,
                    since,
                    per_page: 100
                  }
                );

                totalCommits += commits.length;

              } catch (error) {
                core.warning(
                  `Could not count commits in ${repository.name}: ${error.message}`
                );
              }
            }

            // Get developer contribution statistics
            async function getContributionStats(login) {
              const result = await github.graphql(
                `query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      contributionCalendar {
                        totalContributions
                        weeks {
                          contributionDays {
                            date
                            contributionCount
                          }
                        }
                      }
                    }
                  }
                }`,
                {
                  login,
                  from: since,
                  to: new Date().toISOString()
                }
              );

              const calendar =
                result.user.contributionsCollection.contributionCalendar;

              const days = calendar.weeks
                .flatMap(week => week.contributionDays)
                .sort((a, b) => a.date.localeCompare(b.date));

              let longest = 0;
              let run = 0;

              for (const day of days) {
                if (day.contributionCount > 0) {
                  run++;
                  longest = Math.max(longest, run);
                } else {
                  run = 0;
                }
              }

              const today = new Date()
                .toISOString()
                .slice(0, 10);

              const yesterdayDate = new Date();
              yesterdayDate.setUTCDate(
                yesterdayDate.getUTCDate() - 1
              );

              const yesterday = yesterdayDate
                .toISOString()
                .slice(0, 10);

              let index = days.length - 1;

              if (
                days[index]?.date === today &&
                days[index].contributionCount === 0
              ) {
                index--;
              }

              let current = 0;

              if (
                days[index]?.date === today ||
                days[index]?.date === yesterday
              ) {
                while (
                  index >= 0 &&
                  days[index].contributionCount > 0
                ) {
                  current++;
                  index--;
                }
              }

              return {
                current,
                longest,
                total: calendar.totalContributions
              };
            }

            // Collect all developer statistics
            const developerStats = [];

            for (const member of members) {
              try {
                const stats = await getContributionStats(
                  member.login
                );

                developerStats.push({
                  login: member.login,
                  ...stats
                });

              } catch (error) {
                core.warning(
                  `Could not load ${member.login}: ${error.message}`
                );
              }
            }

            // Sort developers by current streak
            developerStats.sort(
              (a, b) =>
                b.current - a.current ||
                b.total - a.total
            );

            // Generate developer table
            const table = [
              "| Entwickler | Aktuelle Streak | Längste Streak (365 Tage) | Beiträge (365 Tage) |",
              "|---|---:|---:|---:|",
              ...developerStats.map(member =>
                `| [@${member.login}](https://github.com/${member.login}) | 🔥 ${member.current} Tage | ${member.longest} Tage | ${member.total} |`
              )
            ].join("\n");

            // Generate update timestamp
            const updated = new Date()
              .toISOString()
              .replace("T", " ")
              .slice(0, 16) + " UTC";

            // Build statistics section
            const statsBlock = [
              "<!-- LODGE_STATS_START -->",
              "## 📊 Live Organization Statistics",
              "",
              `- **Repositories:** ${repos.length}`,
              `- **Commits in the last 365 days:** ${totalCommits}`,
              `- **Organization members:** ${members.length}`,
              `- **Last update:** ${updated}`,
              "",
              "### 🔥 Developer GitHub Streaks",
              "",
              "> Contribution totals and streaks show each developer's account-wide GitHub activity, not only Lodge V contributions. Private contributions may not be visible.",
              "",
              table,
              "",
              "<!-- LODGE_STATS_END -->"
            ].join("\n");

            // Fetch README
            const { data: file } =
              await github.rest.repos.getContent({
                owner,
                repo,
                path: "profile/README.md"
              });

            const original = Buffer
              .from(file.content, "base64")
              .toString("utf8");

            const startMarker =
              "<!-- LODGE_STATS_START -->";

            const endMarker =
              "<!-- LODGE_STATS_END -->";

            const start = original.indexOf(startMarker);
            const end = original.indexOf(endMarker);

            let next;

            if (
              start !== -1 &&
              end !== -1 &&
              end >= start
            ) {
              next =
                original.slice(0, start) +
                statsBlock +
                original.slice(end + endMarker.length);

            } else {
              next =
                original.trimEnd() +
                "\n\n" +
                statsBlock +
                "\n";
            }

            // Update README
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "profile/README.md",
              message: "chore: update Lodge V organization statistics",
              sha: file.sha,
              content: Buffer
                .from(next, "utf8")
                .toString("base64")
            });

            core.info("Lodge V statistics updated successfully.");
